<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Викторина</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-code"></i> IT Викторина для Начинающих</h1>
            <p class="subtitle">Проверь свои знания в мире технологий!</p>
        </header>

        <div class="quiz-container">
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text">Вопрос <span id="currentQuestion">1</span> из <span id="totalQuestions">5</span></div>
            </div>

            <div class="question-card">
                <h2 id="question">Загрузка вопроса...</h2>
                
                <div class="options" id="options">
                    <!-- Варианты ответов появятся здесь -->
                </div>

                <div class="controls">
                    <button id="prevBtn" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Назад
                    </button>
                    <button id="nextBtn" class="btn btn-primary">
                        Далее <i class="fas fa-arrow-right"></i>
                    </button>
                    <button id="submitBtn" class="btn btn-success">
                        <i class="fas fa-paper-plane"></i> Завершить
                    </button>
                </div>
            </div>

            <div class="score-container" id="scoreContainer" style="display: none;">
                <div class="result-card">
                    <h2><i class="fas fa-trophy"></i> Ваш результат</h2>
                    <div class="score-circle">
                        <span id="scoreValue">0</span>
                        <small>из 5</small>
                    </div>
                    <p id="resultMessage">Сообщение о результате</p>
                    <div class="feedback" id="feedback"></div>
                    <button id="restartBtn" class="btn btn-restart">
                        <i class="fas fa-redo"></i> Попробовать снова
                    </button>
                </div>
            </div>
        </div>

        <footer>
            <p>Создано с <i class="fas fa-heart" style="color:#ff416c"></i> для проекта</p>
            <p class="telegram-link">
                <i class="fab fa-telegram"></i> Пройдите викторину также в нашем Telegram-боте!
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
